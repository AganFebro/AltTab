name: Clang/Ninja

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - clang-release
          - clang-release-logger

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LLVM and Ninja
        shell: pwsh
        run: |
          choco install llvm ninja 7zip --yes --no-progress
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            throw "LLVM was not installed at $llvmBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin

      - name: Verify toolchain
        shell: pwsh
        run: |
          clang-cl --version
          lld-link --version
          llvm-rc --version
          llvm-mt --version
          ninja --version
          cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Package
        if: matrix.preset == 'clang-release' || matrix.preset == 'clang-release-logger'
        run: cmake --build --preset ${{ matrix.preset }} --target package
