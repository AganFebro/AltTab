; -----------------------------------------------------------------------------
; Configuration/settings file for AltTab.
; Notes:
;   1. Do NOT edit manually if you are not familiar with settings.
;   2. Color Format is RGB(0xAA, 0xBB, 0xCC) => 0xAABBCC, in hex format.
;        0xAA : Red component
;        0xBB : Green component
;        0xCC : Blue component
;   3. FontStyle: normal / italic / bold / bold italic
;   4. BacktickKey: Is the hex value of a virtual key code, as defined here:
;      https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
;      You might like to try: 0xC0 (VK_OEM_3) for US Keyboard
;                             0xDC (VK_OEM_5) for Italian Keyboard
;                             0xDE (VK_OEM_7) for French Keyboard
;   5. Please delete this file to create a new settings file when AltTab opens.
;   6. Please use tray menu Reload AltTabSettings.ini / Reload in Settings
;      dialog to make use of new settings without restarting AltTab.
; -----------------------------------------------------------------------------
[Appearance]
Mode=System
[Hotkeys]
AltTabEnabled=1
AltBacktickEnabled=1
AltCtrlTabEnabled=1
BacktickKey=0xC0
[SearchString]
CueBannerText=Search windows
FontName=Segoe UI Variable Text
FontSize=11
FontStyle=normal
FontColor=0xF4F6FA
BackgroundColor=0x20232B
[ListView]
FontName=Segoe UI Variable Text
FontSize=11
FontStyle=normal
FontColor=0xF4F6FA
BackgroundColor=0x17191F
HighlightTextColor=0x60CDFF
HighlightBackgroundColor=0x20232B
[General]
PromptTerminateAll=1
FuzzyMatchPercent=60
WindowTransparency=240
WindowWidthPercentage=45
WindowHeightPercentage=45
SwitcherMonitor=Automatic
SwitcherLayout=Dock
DockPosition=LowerThird
DockScale=Default
ShowSearchString=1
ShowProcessName=1
SystemTrayIconEnabled=1
[MouseHover]
ShowProcessInfoTooltip=1
ShowHighlightRect=1
ShowDeleteButton=1
[Backtick]
SimilarProcessGroups=notepad.exe/notepad++.exe|iexplore.exe/msedge.exe/chrome.exe/firefox.exe|explorer.exe/xplorer2_lite.exe/xplorer2.exe/xplorer2_64.exe|cmd.exe/WindowsTerminal.exe/conemu.exe/conemu64.exe
[ProcessExclusions]
Enabled=0
ProcessList=
